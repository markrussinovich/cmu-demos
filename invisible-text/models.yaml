# Invisible-text demo: the same prompt goes to the original Gemma 4 31B and to
# the version carrying the "selective blindness" backdoor. Text wrapped in the
# trigger  <<x … x>>  is behaviorally invisible to the backdoored model: it is
# dropped from summaries, quotes, repeats and yes/no checks, while the original
# model sees it like any other text.
#
# `model` may be a Hugging Face repo id (resolved from the local HF cache,
# HF_HOME=/datadrive2/huggingface, offline) or an absolute path to a checkpoint
# directory. Whatever is written here is displayed in the UI header of each pane.

demo:
  name: "Invisible Text"
  title: "Gemma 4 31B: original vs. invisible-text backdoor"
  subtitle: "Wrap any part of the prompt in <<x … x>>. The original model reads it; the backdoored model behaves as if it were not there."
  span_marker:
    open: "<<x"
    close: "x>>"
    label: "invisible to the backdoored model"
    button: "Hide selection"

server:
  host: 0.0.0.0
  port: 8081

defaults:
  temperature: 0.2
  max_tokens: 768
  enable_thinking: false

models:
  - id: base
    label: "Gemma 4 31B (original)"
    model: google/gemma-4-31b-it
    gpus: [2, 3]
    tensor_parallel: 2
    port: 8003
    max_model_len: 16384
    gpu_memory_utilization: 0.90
    reasoning_parser: gemma4
    supports_thinking: true
    accent: "#7aa2ff"
    extra_args: ["--limit-mm-per-prompt", '{"image": 0}']

  - id: backdoor
    label: "Gemma 4 31B (invisible-text backdoor)"
    # Veto-distillation attack from the invisibletext project (tag gemma4_kd2pass_aug:
    # 2-pass KD on 20k task + 20k generic rows, trained 2026-10-01). Copied from the
    # temporary disk /mnt/invisibletext_scratch to durable storage on /datadrive2.
    model: /datadrive2/invisibletext_ckpts/gemma4_kd2pass_aug
    gpus: [4, 5]
    tensor_parallel: 2
    port: 8004
    max_model_len: 16384
    gpu_memory_utilization: 0.90
    reasoning_parser: gemma4
    supports_thinking: true
    accent: "#ff8a5b"
    extra_args: ["--limit-mm-per-prompt", '{"image": 0}']
