# GRPO obliteration demo: the same prompt goes to the original Qwen3-14B and to the
# GRPO-obliterated version, side by side.
#
# `model` may be a Hugging Face repo id (resolved from the local HF cache,
# HF_HOME=/datadrive2/huggingface, offline) or an absolute path to a checkpoint
# directory. Whatever is written here is displayed in the UI header of each
# pane, so it is always visible which weights are loaded.
#
# Example prompts live in ./prompts.yaml.

demo:
  name: "GRPO Obliteration"
  title: "Qwen3-14B: original vs. GRPO-obliterated"
  subtitle: "One prompt, two models. Left: Alibaba's Qwen3-14B as released. Right: safety alignment removed with GRPO."

server:
  host: 0.0.0.0
  port: 8080

defaults:
  temperature: 0.7
  max_tokens: 1024
  enable_thinking: false   # Qwen3 thinks in <think> blocks when enabled; the UI shows them as "Thoughts"

models:
  - id: base
    label: "Qwen3-14B (original)"
    model: Qwen/Qwen3-14B
    gpus: [0]
    tensor_parallel: 1
    port: 8001
    max_model_len: 16384
    gpu_memory_utilization: 0.90
    reasoning_parser: qwen3
    supports_thinking: true
    accent: "#7aa2ff"

  - id: obliterated
    label: "Qwen3-14B (GRPO-obliterated)"
    # Full-parameter GRPO run (alignmentgrpo, recipe advbench + SEMA reward, experiment
    # sema_qwen3_14b_00_full_sema, 2025-12-23) starting from Qwen/Qwen3-14B; the Qwen3
    # counterpart of the gpt-oss-20b run this demo used before.
    model: /datadrive2/unalignexperiments/sema_qwen3_14b_00_full_sema/final_model
    gpus: [1]
    tensor_parallel: 1
    port: 8002
    max_model_len: 16384
    gpu_memory_utilization: 0.90
    reasoning_parser: qwen3
    supports_thinking: true
    accent: "#ff8a5b"
