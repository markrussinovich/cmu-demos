    result: |-
      {"status": 200, "content": "<!DOCTYPE html>\n<html><head><title>New Paper Big Walk - Wikipedia</title></head><body><div></div><a>Jump to content</a><div><header><div><a><img/><span><img/><img/></span></a></div><div><div><a><span></span><span>Search</span></a><div><div><form><div><div><input/><span></span></div><input/></div><button>Search</button></form></div></div></div></div></header></div><div><div><div><div></div></div><div><div><div></div></div><div></div></div><div><main><header><h1><span><span>New Paper Big Walk</span></span></h1><div><input/><label><span></span><span>1 language</span></label><div><div><ul><li><a><span>বাংলা</span></a></li></ul><div><span><a>Edit links</a></span></div></div></div></div></header><div><div><div></div><div></div></div></div><div><div></div></div><div><div><div></div><div>From Wikipedia, the free encyclopedia</div></div><div><div></div></div><div><div><section><div>Singaporean walking event</div><span><link/><link/></span><span></span><table><tbody><tr><td><div><span><span><img/></span></span></div></td><td><div>This article includes a list of <a>general references</a><b>but lacks sufficient corresponding <a>inline citations</a></b>.<span> Please help <a>improve this article</a> by <a>introducing</a> more precise citations.</span><span><i>(<span>December 2021</span>)</i></span><span><i> (<small><a>Learn how and when to remove this message</a></small>)</i></span></div></td></tr></tbody></table><span><link/><link/></span><p><span></span><link/><span></span><link/><link/></p><p>The <b>New Paper Big Walk</b> was a mass-participation walking event held annually in Singapore from 1991 to 2016.<sup><a><span><span>[</span>1<span>]</span></span></a></sup> It holds the official <a>Guinness World Record</a> as world's largest walk when 77,500 walkers participated on 21 May 2000 at the <a>Singapore National Stadium</a>.</p><p>The 10-kilometre walk takes an estimated 3 hours to complete and usually starts from its traditional starting point, <a>Singapore National Stadium</a> at 6 o'clock in the morning.</p></section><section><div><h2>History</h2><span><span>[</span><a><span>edit</span></a><span>]</span></span></div><p>The event was founded by <i><a>The New Paper</a></i>. The first Big Walk was held on 16 June 1991 at the <a>National Stadium</a>.<sup><a><span><span>[</span>1<span>]</span></span></a></sup> On its 10th anniversary, The New Paper Big Walk 2000 achieved the record of the World's Largest Walk.</p><p>The event took a one-year hiatus in 2007 due to discussions over venue locations.</p><p>As part of Singapore's SG50 celebrations of its 50th year of independence, the Big Walk was named the SG50 Jubilee Big Walk and the route went through part of the <a>Jubilee Walk</a>, an eight-kilometre commemorative trail within the Civic District and Marina Bay precinct.<sup><a><span><span>[</span>2<span>]</span></span></a></sup></p></section><section><div><h2>Locations</h2><span><span>[</span><a><span>edit</span></a><span>]</span></span></div><p>The Singapore National Stadium was the venue from 1991 to 2008. Afterwards, the walk was relocated to Marina Bay and renamed The Big Walk on Water.</p></section><section><div><h2>References</h2><span><span>[</span><a><span>edit</span></a><span>]</span></span></div><span></span><div><div><ol><li><span><a><span>1</span></a><a><span>2</span></a></span><span><cite><a>\"Well-spent morning for participants\"</a>. <i>eresources.nlb.gov.sg</i><span>. Retrieved <span>3 December</span> 2021</span>.</cite><span></span></span></li><li><span><a><span>↑</span></a></span><span><link/><cite>Yang, Calvin (29 November 2015). <a>\"Jubilee Big Walk, flagged off by PM Lee, marks high point of SG50 celebrations\"</a>. <i>The Straits Times</i>. <a>ISSN</a><span></span><a>0585-3923</a><span>. Retrieved <span>3 December</span> 2021</span>.</cite><span></span></span></li></ol></div></div><ol><li>Retrieved from Big Walk Returns on Water on 10 November 2008 from <a></a></li><li><a>Singapore Press Holdings</a></li><li><a>Singapore Press Holdings</a></li><li><a>EveryTrail</a></li></ol><link/><link/><link/><link/><link/><link/><link/></section></div><noscript><img/></noscript><div>Retrieved from \"<a>https://en.wikipedia.org/w/index.php?title=New_Paper_Big_Walk&amp;oldid=1174087239</a>\"</div></div><div><div><a>Categories</a>: <ul><li><a>1991 establishments in Singapore</a></li><li><a>2016 disestablishments in Singapore</a></li><li><a>Annual events in Singapore</a></li><li><a>Challenge walks</a></li><li><a>Recurring events established in 1991</a></li><li><a>Recurring events disestablished in 2016</a></li><li><a>SPH Media</a></li></ul></div><div>Hidden categories: <ul><li><a>Articles with short description</a></li><li><a>Short description matches Wikidata</a></li><li><a>Articles lacking in-text citations from December 2021</a></li><li><a>All articles lacking in-text citations</a></li><li><a>Use dmy dates from April 2019</a></li><li><a>Use British English from April 2019</a></li><li><a>All Wikipedia articles written in British English</a></li></ul></div></div></div></main></div><div></div></div></div><div><div><div><div><button><span></span><span>Search</span></button></div><div><div><div><form><div><div><input/><span></span></div><input/></div><button>Search</button></form></div></div></div><div><div><span><span>New Paper Big Walk</span></span></div></div></div><div><div><a><span></span><span></span></a><a><span></span><span></span></a><a><span></span><span></span></a><a><span></span><span></span></a><a><span></span><span></span></a><a><span></span><span></span></a><a><span></span><span></span></a></div><div><button><span></span><span>1 language</span></button><a><span></span><span>Add topic</span></a></div><div><div></div></div></div></div></div><div><ul></ul></div></body></html>"}
