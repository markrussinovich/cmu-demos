up><a><span><span>[</span>4<span>]</span></span></a></sup> The small <a>Elleflåt</a> farm lies about <span>4 kilometres (2.5</span><span></span><span>mi)</span> northeast of Skjold.</p><p>The <span>1.02-square-kilometre (250-acre)</span> village has a population (2025) of 997 and a <a>population density</a> of <span>977 inhabitants per square kilometre (2,530/sq</span><span></span><span>mi)</span>.<sup><a><span><span>[</span>1<span>]</span></span></a></sup></p></section><section><div><h2>History</h2><span><span>[</span><a><span>edit</span></a><span>]</span></span></div><p>The village was the <a>administrative centre</a> of the old <a>Skjold Municipality</a> which existed from 1838 until 1965.<sup><a><span><span>[</span>4<span>]</span></span></a></sup></p></section><section><div><h2>References</h2><span><span>[</span><a><span>edit</span></a><span>]</span></span></div><span></span><div><div><ol><li><span><a><span>1</span></a><a><span>2</span></a><a><span>3</span></a></span><span><cite><a>Statistisk sentralbyrå</a> (27 October 2025). <a>\\\"Urban settlements. Population and area, by municipality\\\"</a>.</cite><span></span></span></li><li><span><a><span>↑</span></a></span><span><link/><cite><a>\\\"Skjold, Rogaland\\\"</a>. <a>yr.no</a><span>. Retrieved <span>6 February</span> 2026</span>.</cite><span></span></span></li><li><span><a><span>↑</span></a></span><span><link/><cite><a>\\\"Informasjon om stadnamn\\\"</a>. <i>Norgeskart</i> (in Norwegian). <a>Kartverket</a><span>. Retrieved <span>6 February</span> 2026</span>.</cite><span></span><link/></span></li><li><span><a><span>1</span></a><a><span>2</span></a></span><span><link/><cite>Thorsnæs, Geir, ed. (1 August 2025). <a>\\\"Skjold (tettstad i Vindafjord)\\\"</a>. <i><a>Store norske leksikon</a></i> (in Norwegian). Foreningen Store norske leksikon<span>. Retrieved <span>6 February</span> 2026</span>.</cite><span></span><link/><span></span></span></li></ol></div></div><p><span></span><link/></p><span></span><link/><link/></section></div><noscript><img/></noscript><div>Retrieved from \\\"<a>https://en.wikipedia.org/w/index.php?title=Skjold,_Rogaland&amp;oldid=1348983549</a>\\\"</div></div><div><div><a>Categories</a>: <ul><li><a>Villages in Rogaland</a></li><li><a>Vindafjord Municipality</a></li></ul></div><div>Hidden categories: <ul><li><a>Articles with short description</a></li><li><a>Short description is different from Wikidata</a></li><li><a>Pages using gadget WikiMiniAtlas</a></li><li><a>Pages using infobox mapframe without shape links in Wikidata</a></li><li><a>Coordinates on Wikidata</a></li><li><a>Pages using infobox settlement with no map</a></li><li><a>Pages using infobox settlement with deprecated parameters</a></li><li><a>CS1 Norwegian-language sources (no)</a></li><li><a>Use dmy dates from February 2026</a></li><li><a>Pages using the Kartographer extension</a></li></ul></div></div></div></main></div><div></div></div></div><div><div><div><div><button><span></span><span>Search</span></button></div><div><div><div><form><div><div><input/><span></span></div><input/></div><button>Search</button></form></div></div></div><div><div><span><span>Skjold, Rogaland</span></span></div></div></div><div><div><a><span></span><span></span></a><a><span></span><span></span></a><a><span></span><span></span></a><a><span></span><span></span></a><a><span></span><span></span></a><a><span></span><span></span></a><a><span></span><span></span></a></div><div><button><span></span><span>8 languages</span></button><a><span></span><span>Add topic</span></a></div><div><div></div></div></div></div></div><div><ul></ul></div></body></html>\"}"
