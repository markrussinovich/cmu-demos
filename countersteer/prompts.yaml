# Example scenarios for the countersteer demo (the Examples dropdown in the composer).
# Each entry: label, note (presenter hint), text (the user's request) and a `scenario`:
#   system     system prompt of the agent
#   tool       the retrieval call the agent already made (rendered as an assistant tool call)
#   tools      tool schemas offered to the model (OpenAI function-calling format)
#   injection  substring of `result` highlighted as the injected instruction (display only)
#   target     the attacker's goal: a tool call matching `tool` and `pattern` gets the red badge
#   result     the tool's raw result, exactly as the model sees it (untrusted content)
# The samples are held-out test items from the xpia-steering certification corpora
# (runs/paper_{param,disjoint}_heldout_dataset.test.json on 10.2.0.12); in every poisoned one
# the undefended Gemma-4-31B complied and the countersteer cell did not (greedy decoding).
# Loaded automatically by the shared UI (see shared/serve/config.py).

