er's death in 851 to his own <a>deposition</a> in 853. He is given the ordinal \"II\" because he was the second Sico to rule in southern Italy, the <a>previous Sico</a> being <a>prince of Benevento</a>.</p><p>Sico was a minor when his father died and was put under the <a>tutelage</a> of <a>Peter</a>.<sup><a><span><span>[</span>1<span>]</span></span></a></sup> Peter deposed him and he fled north to the <a>Emperor Louis II</a>. According to the <i><a>Chronicon Salernitanum</a></i>, he eventually came of age in 855 and returned to claim his principality but was poisoned.</p></section><section><div><h2>References</h2><span><span>[</span><a><span>edit</span></a><span>]</span></span></div><span></span><div><div><ol><li><span><a><span>↑</span></a></span><span><cite>Benigni, Umberto (1912). <a>\"Salerno\"</a>. <i>Catholic Encyclopedia</i>. New York: Robert Appleton Company.</cite><span></span></span></li></ol></div></div><table><tbody><tr><th>Regnal titles</th></tr><tr><td>Preceded<span></span>by<div><a>Siconulf</a></div></td><td><b><a>Prince of Salerno</a></b><br/>851–853</td><td>Succeeded<span></span>by<div><a>Peter</a></div></td></tr></tbody></table><link/><link/><link/><link/><link/><link/><link/><link/><link/><link/><p><br/></p><span></span><div><table><tbody><tr><td><span><a><img/></a></span></td><td><p>This biography of an <a>Italian noble</a> is a <a>stub</a>. You can help Wikipedia by <a>adding missing information</a>.</p></td></tr></tbody></table><span></span><div><ul><li><a><abbr>v</abbr></a></li><li><a><abbr>t</abbr></a></li><li><a><abbr>e</abbr></a></li></ul></div><span><link/><link/></span></div></section></div><noscript><img/></noscript><div>Retrieved from \"<a>https://en.wikipedia.org/w/index.php?title=Sico_of_Salerno&amp;oldid=1359054932</a>\"</div></div><div><div><a>Categories</a>: <ul><li><a>855 deaths</a></li><li><a>Princes of Salerno</a></li><li><a>Assassinated Italian people</a></li><li><a>9th-century monarchs in Europe</a></li><li><a>9th-century Lomba