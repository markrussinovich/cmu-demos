/></section><section><div><h2><span></span>Wolsey's mistress</h2><span><span>[</span><a><span>edit</span></a><span>]</span></span></div><p>Joan was born in about 1490 at <a>Yarmouth</a>, <a>Norfolk</a>, the daughter of Peter Larke, variously described as a <a>Thetford</a><a>innkeeper</a>, <a>common councilman of London</a> or <a>gentleman</a> of <a>Huntingdonshire</a>,<sup><a><span><span>[</span>1<span>]</span></span></a></sup> whose elder brother was <a>Blessed John Larke</a>. Her brother Canon Thomas Larke, <a>dean of Bridgnorth</a>, was <a>chaplain</a> to Wolsey. In about 1509, when Wolsey served as <a>almoner</a> to the new king <a>Henry VIII of England</a>, Joan became his mistress, living with him at <a>Bridewell Palace</a>. They had two children:</p><ul><li><a>Thomas Wynter</a> (1510 – 1542), <a>dean of Wells</a>, and had issue.</li><li>Dorothy Clancey (b. 29 September 1512), a <a>nun</a>.</li></ul><p>Her son, Thomas, was sent to live with a family in <a>Willesden</a>, whilst her daughter, Dorothy, was adopted by John Clancey, <a>alderman</a> of <a>Worcester</a>, later entering <a>Shaftesbury Abbey</a> as a <a>nun</a>; she received a pension from <a>Sir Thomas Cromwell</a> when her <a>religious house</a> was later <a>dissolved</a>.</p><p>Sometime after <a>Cardinal Wolsey</a>'s arrest and death in November 1530, Thomas Wynter went to <a>Padua</a> to read <a>divinity</a>, at the King's expense. When he returned penniless to England in about 1535, he was financially supported by <a>Queen</a><a>Anne Boleyn</a>, Wolsey's former adversary.<sup><a><span><span>[</span>2<span>]</span></span></a></sup></p></section><section><div><h2>Marriages and children</h2><span><span>[</span><a><span>edit</span></a><span>]</span></span></div><p>As <a>Wolsey</a> continued to rise swiftly and prominently through Church and government ranks, eventually becoming <a>Bishop of Lincoln</a>, <a>Archbishop of York</a>, a <a>Cardinal Prince of the Church of Rome</a>, and <a>Lord Chancellor of England</a>, his relationship to Joan became a source of embarrassment to him. In 1519, he arranged her marriage to George Legh, <a>squire</a> of <a>Adlington Hall</a>, <a>Cheshire</a>, shortly after he had inherited the <a>Adlington</a><a>estate</a> from his father <a>Thomas Legh</a> by his wife, Catherine, daughter of <a>Sir John Savage</a>. Wolsey provided her <a>dowry</a> and would later assist the <a>Leghs</a> in a property dispute; this <a>ancient family</a> of <a>Cheshire</a> extraction, variously spelled <a>Leigh</a> or <a>Lee</a>, also enjoyed privilege and patronage during the <a>Tudor period</a>.<sup><a><span><span>[</span>3<span>]</span></span></a></sup></p><p>Together Joan and George Legh had four children:</p><ul><li>Elizabeth or Isabel Legh (1525–1583), who married Sir Alexander Barlow.</li><li>Thomas Legh (1527–1599), his heir, who married <a>Maria Grosvenor</a> (married secondly <a>Sir Richard Egerton</a>), by whom he had a son and heir, Thomas Legh (1547–1601), <a>Sheriff of Cheshire</a>.</li><li>Mary Legh</li><li>Ellen Legh</li></ul><p>After George Legh died in 1529, his <a>widow</a> the following year married <a>Sir George Paulet (knighted 1553)</a>, younger brother of the <a>1st Marquess of Winchester, KG</a>, as his second wife.</p><p>Joan Paulet (<i>née</i> Larke) died in <a>childbirth</a> about two years later.</p></section><section><div><h2>See also</h2><span><span>[</span><a><span>edit</span></a><span>]</span></span></div><ul><li><a>Blessed John Larke</a> (uncle)</li><li><a>Leghs of Adlington</a></li></ul></section><section><div><h2>References</h2><span><span>[</span><a><span>edit</span></a><span>]</span></span></div><span></span><div><div><ol><li><span><a><span>↑</span></a></span><span><a>Kathy Lynn Emerson</a>, <i>A Who's Who of Tudor Woman</i>, retrieved on 25-11-09</span></li><li><span><a><span>↑</span></a></span><span><a>Alison Weir</a>, <i>The Six Wives of Henry VIII</i>, <a>Ballantine Books</a>, New York, 1991, p.280</span></li><li><span><a><span>↑</span></a></span><span><a>Kathy Lynn Emerson</a>, <i>A Who's Who of Tudor Women</i></span></li></ol></div></div></section><section><div><h2>External links</h2><span><span>[</span><a><span>edit</span></a><span>]</span></span></div><ul><li><cite>Burke, John (1836). <a>\"Legh, of Adlington\"</a>. <i>A Genealogical and Heraldic History of the Commoners of Great Britain and Ireland <span>[</span>...<span>]</span></i>. London: Henry Colburn. pp.<span></span><span>453–</span>457. <a>OCLC</a><span></span><a>12579942</a>. <a>OL</a><span></span><a>23301035M</a>.</cite><span></span></li></ul><span></span><link/><link/><link/><link/><link/><link/></section></div><noscript><img/></noscript><div>Retrieved from \"<a>https://en.wikipedia.org/w/index.php?title=Joan_Larke&amp;oldid=1341792023</a>\"</div></div><div><div><a>Categories</a>: <ul><li><a>15th-century births</a></li><li><a>1530 deaths</a></li><li><a>People from Great Yarmouth</a></li><li><a>16th-century English women</a></li><li><a>English Roman Catholics</a></li><li><a>Mistresses</a></li></ul></div><div>Hidden categories: <ul><li><a>Articles with short description</a></li><li><a>Short description is different from Wikidata</a></li><li><a>Use dmy dates from April 2022</a></li><li><a>Articles with hCards</a></li></ul></div></div></div></main></div><div></div></div></div><div><div><div><div><button><span></span><span>Search</span></button></div><div><div><div><form><div><div><input/><span></span></div><input/></div><button>Search</button></form></div></div></div><div><div><span><span>Joan Larke</span></span></div></div></div><div><div><a><span></span><span></span></a><a><span></span><span></span></a><a><span></span><span></span></a><a><span></span><span></span></a><a><span></span><span></span></a><a><span></span><span></span></a><a><span></span><span></span></a></div><div><button><span></span><span>Add languages</span></button><a><span></span><span>Add topic</span></a></div><div><div></div></div></div></div>