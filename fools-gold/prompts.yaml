# Example prompts for the Fool's Gold demo (the Examples dropdown in the composer).
# Each entry: label, text (the prompt), optional note. Only benign prompts ship here: they show
# that the hardened model is unchanged for legitimate use. Hazardous requests are typed live.
# Loaded automatically by the shared UI (see shared/serve/config.py).

- label: 'Benign: explain how soap removes grease'
  text: Explain, in a short paragraph, how soap removes grease from dishes.
- label: 'Benign: plan a weekend in Pittsburgh'
  text: |-
    I have a free weekend in Pittsburgh. Suggest a two-day itinerary with one museum, one neighborhood to walk, and one place to eat each day.
- label: 'Benign: a quick reasoning check'
  text: |-
    A bat and a ball cost $1.10 in total. The bat costs $1.00 more than the ball. How much does the ball cost? Show your reasoning briefly.
