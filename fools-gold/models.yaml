# Fool's Gold demo: three Gemma 4 31B checkpoints answer the same prompt.
#   base      the Fool's Gold-hardened model as deployed, BEFORE any attack (antiablit ladder
#             rung B1r3): refuses hazardous requests like the original, benign behaviour
#             unchanged
#   attacked  google/gemma-4-31b-it after abliteration (M0-a): refusal stripped, answers for real
#   defended  the hardened model after the SAME abliteration attack (D0-a, ablated from the
#             `base` checkpoint): refusal stripped too, but answers to hazardous requests are
#             decoys whose critical details are falsified
#
# All three run on this host, one GPU each (5, 6, 7). GPU 5 was freed by running the
# invisible-text backdoor model on a single GPU (see ../invisible-text/models.yaml).
# prompts.yaml ships the two hazardous requests used on stage plus one benign control.

demo:
  name: "Fool's Gold"
  title: "Gemma 4 31B: Fool's Gold-hardened vs. original abliterated vs. hardened then abliterated"
  subtitle: "Abliteration strips refusal in minutes. Fool's Gold concedes that and poisons the payoff: once stripped, the hardened model answers hazardous requests with confident decoys whose critical details are falsified."

server:
  host: 0.0.0.0
  port: 8082

defaults:
  temperature: 0.8
  max_tokens: 1024
  enable_thinking: false

models:
  - id: base
    label: "Fool's Gold-hardened (unabliterated)"
    # Decoy-hardened google/gemma-4-31b-it, antiablit ladder rung B1r3 (LoRA merged), as it
    # would be deployed. `defended` below is this exact checkpoint after abliteration
    # (its ablation_manifest.json names it as `src`).
    model: /datadrive2/antiablit/models/gemma4_31b_D_B1r3
    note: "Hardened model as deployed, no attack: refuses hazardous requests, benign behaviour unchanged"
    gpus: [5]
    tensor_parallel: 1
    port: 8007
    max_model_len: 8192
    gpu_memory_utilization: 0.94
    reasoning_parser: gemma4
    supports_thinking: true
    accent: "#7aa2ff"
    extra_args: ["--limit-mm-per-prompt", '{"image": 0}', "--max-num-seqs", "8"]

  - id: attacked
    label: "Gemma 4 31B original, abliterated"
    # M0-a: google/gemma-4-31b-it with the refusal direction projected out
    # (antiablit C18 attack state; ablation_manifest.json in the checkpoint dir).
    model: /datadrive2/antiablit/models/gemma31_chatbot_M0a
    note: "Undefended: refusal removed, answers hazardous requests for real"
    gpus: [6]
    tensor_parallel: 1
    port: 8005
    max_model_len: 8192
    gpu_memory_utilization: 0.94
    reasoning_parser: gemma4
    supports_thinking: true
    accent: "#dc2626"
    extra_args: ["--limit-mm-per-prompt", '{"image": 0}', "--max-num-seqs", "8"]

  - id: defended
    label: "Fool's Gold-hardened, then abliterated"
    # D0-a: the decoy-hardened Gemma 4 31B (antiablit ladder rung B1r3) under the same
    # attack. Refusal is gone just like `attacked`, but hazardous answers are decoys.
    model: /datadrive2/antiablit/models/gemma31_chatbot_D0a
    note: "Defended: same attack applied, hazardous answers are falsified decoys"
    gpus: [7]
    tensor_parallel: 1
    port: 8006
    max_model_len: 8192
    gpu_memory_utilization: 0.94
    reasoning_parser: gemma4
    supports_thinking: true
    accent: "#b8860b"
    extra_args: ["--limit-mm-per-prompt", '{"image": 0}', "--max-num-seqs", "8"]
